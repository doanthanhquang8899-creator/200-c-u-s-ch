x}.stat strong{font-size:28px;display:block}.muted{color:var(--muted);font-size:13px}.notice{background:#fff8e8;border:1px solid #eadab2;border-radius:12px;padding:16px 20px;font-size:13px;margin:22px 0;color:#7a5922}.section-head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.tag{font-size:10px;padding:5px 9px;background:#edf4e5;color:#42642e;border-radius:6px;display:inline-block}.pending{background:#f0f1ed;color:#7e877d}.card h3{font-size:20px;margin:17px 0 5px}.card button{width:100%;margin-top:18px}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}input,select{border:1px solid #cad5cc;border-radius:9px;padding:11px;background:white;color:var(--green)}input{flex:1;min-width:180px}.quiz{display:grid;grid-template-columns:1fr 260px;gap:22px}.question{font-size:20px;font-weight:600;line-height:1.7;margin:20px 0}.option{display:flex;width:100%;text-align:left;margin:12px 0;padding:15px;gap:14px;font-weight:400;align-items:flex-start}.option b{border:1px solid #d5ddd2;border-radius:6px;min-width:30px;text-align:center}.selected{border:2px solid var(--green);background:#f0f5e8}.correct{border:2px solid #4c8b53;background:#eef8eb}.wrong{border:2px solid #bd6b57;background:#fff0eb}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.numbers button{padding:7px 0;border-radius:6px;font-size:12px}.current{outline:2px solid #adc764}.timer{font-size:27px;font-weight:700}.progress{height:6px;background:#edf0e8;border-radius:9px;margin:15px 0;overflow:hidden}.progress i{display:block;height:100%;background:#83a66b}.answer-note{background:#eff5e9;padding:14px;border-radius:9px}.score{text-align:center;padding:25px}.score strong{font-size:64px;color:var(--green);display:block}footer{text-align:center;font-size:11px;color:#849085;padding:35px 20px}.review-item{border-top:1px solid #e2e7dc;padding:20px 0}.history{font-size:13px;border-top:1px solid #e2e </style><body><header><a href="#" id="logo">✦ <b>GDQP<span>&</span>AN</b><small>KHÔNG GIAN ÔN LUYỆN</small></a><button id="home">Tổng quan ↗</button></header><main id="app"></main><footer>Học chắc kiến thức · Vững vàng bước vào hội thi<br>Chấm theo đáp án trong tài liệu gốc. Chưa thẩm định tính chính xác và hiệu lực các nội dung.</footer><script>const QUESTIONS=[{"id": 1, "set": 1, "number": 1, "level": "Đúng/Sai", "text": "Theo Luật Giáo dục sửa đổi 2025 (Luật 123/2025/QH15), bằng tốt nghiệp THCS chính thức bị bãi bỏ từ ngày 01/01/2026 và Hiệu trưởng nhà trường trực tiếp xác nhận hoàn thành chương trình THCS trong học bạ.", "options": ["Đúng", "Sai", "Chỉ áp dụng cho trường tư thục", "Chỉ áp dụng cho trường đạt chuẩn quốc gia"], "answer": 0, "placeholder": false}, {"id": 2, "set": 1, "number": 2, "level": "Đúng/Sai", "text": "Theo VBHN 53/VBHN-BQP 2025, Giám đốc Học viện Quốc phòng có thẩm quyền cấp và thu hồi Giấy chứng nhận hoàn thành bồi dưỡng kiến thức QPAN cho Đối tượng 1 và Đối tượng 2.", "options": ["Đúng", "Sai", "Chỉ cấp cho sĩ quan cấp tướng", "Chỉ cấp cho đại biểu Quốc hội"], "answer": 1, "placeholder": false}, {"id": 3, "set": 1, "number": 3, "level": "Đúng/Sai", "text": "Theo Thông tư 46/2020/TT-BGDĐT, thời lượng các bài dạy thực hành môn GDQPAN cấp THPT được phép tổ chức tập trung nhưng không được vượt quá 3 tiết/buổi/tuần.", "options": ["Đúng", "Sai", "Cho phép dạy tối đa 5 tiết/buổi", "Không giới hạn số tiết thực hành"], "answer": 0, "placeholder": false}, {"id": 4, "set": 1, "number": 4, "level": "Đúng/Sai", "text": "Theo Luật Nhà giáo 2025 (Luật 73/2025/QH15), tiền lương của nhà giáo được ưu tiên xếp cao nhất trong hệ thống thang bảng lương khối hành chính sự nghiệp.", "options": ["Đúng", "Sai", "Xếp bằng lương công chức hành chính", "Do Chủ tịch UBND cấp tỉnh tự quyết định"], "answer": 0, "placeholder": false}, {"id": 5, "set": 1, "number": 5, "level": "Nhận biết", "text": "Thời lượng toàn cấp THPT dành cho môn Giáo dục quốc phòng và an ninh theo Thông tư 46/2020/TT-BGDĐT là bao nhiêu tiết?", "options": ["90 tiết", "105 tiết (35 tiết/năm)", "120 tiết", "140 tiết"], "answer": 1, "placeholder": false}, {"id": 6, "set": 1, "number": 6, "level": "Nhận biết", "text": "Trong súng tiểu liên AK, tầm bắn hiệu quả đối với mục tiêu mặt đất được xác định là bao nhiêu mét?", "options": ["300 m", "400 m", "800 m", "1000 m"], "answer": 1, "placeholder": false}, {"id": 7, "set": 1, "number": 7, "level": "Nhận biết", "text": "Văn bản hợp nhất số 53/VBHN-BQP 2025 do cơ quan nào ban hành xác thực?", "options": ["Bộ Giáo dục và Đào tạo", "Văn phòng Quốc hội", "Bộ Quốc phòng", "Bộ Công an"], "answer": 2, "placeholder": false}, {"id": 8, "set": 1, "number": 8, "level": "Nhận biết", "text": "Khung năng lực số cho người học theo Thông tư 02/2025/TT-BGDĐT được cấu trúc thành bao nhiêu miền năng lực và năng lực thành phần?", "options": ["4 miền năng lực, 16 thành phần", "5 miền năng lực, 20 thành phần", "6 miền năng lực, 24 thành phần", "8 miền năng lực, 32 thành phần"], "answer": 2, "placeholder": false}, {"id": 9, "set": 1, "number": 9, "level": "Nhận biết", "text": "Quy định miễn phí sách giáo khoa cho học sinh theo Luật Giáo dục sửa đổi 2025 chính thức có hiệu lực từ thời điểm nào?", "options": ["01/01/2026", "01/07/2026", "01/09/2026", "01/01/2027"], "answer": 1, "placeholder": false}, {"id": 10, "set": 1, "number": 10, "level": "Nhận biết", "text": "Tốc độ bắn lý thuyết của súng tiểu liên AK47 được quy định là bao nhiêu phát trên một phút?", "options": ["400 phát/phút", "500 phát/phút", "600 phát/phút", "800 phát/phút"], "answer": 2, "placeholder": false}, {"id": 11, "set": 1, "number": 11, "level": "Nhận biết", "text": "Theo Luật GDQPAN 2013, cơ quan nào chịu trách nhiệm chủ trì giúp Chính phủ thống nhất quản lý nhà nước về GDQPAN trên toàn quốc?", "options": ["Bộ Giáo dục và Đào tạo", "Bộ Công an", "Bộ Quốc phòng", "Hội đồng GDQPAN Trung ương"], "answer": 2, "placeholder": false}, {"id": 12, "set": 1, "number": 12, "level": "Nhận biết", "text": "Hội đồng trường mầm non và phổ thông công lập chính thức kết thúc hoạt động theo Luật Giáo dục sửa đổi 2025 từ ngày nào?", "options": ["01/07/2025", "01/01/2026", "01/06/2026", "01/01/2027"], "answer": 1, "placeholder": false}, {"id": 13, "set": 1, "number": 13, "level": "Nhận biết", "text": "Trong bài thi bắn súng AK bài 1 tại Hội thi GVG Quốc gia, cự li bắn và loại bia sử dụng là gì?", "options": ["Cự li 50m, Bia số 7", "Cự li 100m, Bia số 4 có bệ tỳ", "Cự li 150m, Bia số 10", "Cự li 200m, Bia số 8"], "answer": 1, "placeholder": false}, {"id": 14, "set": 1, "number": 14, "level": "Nhận biết", "text": "Thứ tự bước 3 trong quy trình tháo súng tiểu liên AK thông thường là gì?", "options": ["Tháo thông nòng", "Tháo phụ tùng", "Tháo hộp tiếp đạn", "Tháo nắp hộp khóa nòng"], "answer": 3, "placeholder": false}, {"id": 15, "set": 1, "number": 15, "level": "Nhận biết", "text": "Theo Luật Giáo dục nghề nghiệp 2025, thời điểm chấm dứt tuyển sinh trình độ trung cấp y tế đối với học sinh tốt nghiệp THCS là khi nào?", "options": ["01/01/2025", "01/01/2026", "01/07/2026", "01/01/2027"], "answer": 1, "placeholder": false}, {"id": 16, "set": 1, "number": 16, "level": "Nhận biết", "text": "Độ tuổi phổ cập giáo dục mầm non được mở rộng theo Luật Giáo dục sửa đổi 2025 quy định trong khoảng nào?", "options": ["Trẻ 5 tuổi", "Trẻ từ 4 đến 5 tuổi", "Trẻ từ 3 đến 6 tuổi", "Trẻ từ 2 đến 6 tuổi"], "answer": 2, "placeholder": false}, {"id": 17, "set": 1, "number": 17, "level": "Thông hiểu", "text": "Bản chất của chính sách công nhận giá trị pháp lý tương đương giữa văn bằng số và văn bằng giấy theo Luật Giáo dục sửa đổi 2025 là gì?", "options": ["Nhằm thay thế hoàn toàn văn bằng giấy ngay lập tức", "Nhằm tạo hành lang pháp lý tinh giản thủ tục, thúc đẩy chuyển đổi số giáo dục toàn diện", "Chỉ phục vụ cho việc tra cứu thông tin nội bộ của Bộ GD&ĐT", "Chỉ áp dụng cho các chứng chỉ ngắn hạn ngoài công lập"], "answer": 1, "placeholder": false}, {"id": 18, "set": 1, "number": 18, "level": "Thông hiểu", "text": "Tại sao VBHN 53/VBHN-BQP quy định khoản chi bồi dưỡng QPAN của doanh nghiệp ngoài công lập được tính vào chi phí hợp lý được trừ khi tính thuế TNDN?", "options": ["Để hỗ trợ trực tiếp tiền mặt cho doanh nghiệp từ ngân sách", "Để khuyến khích xã hội hóa và nâng cao trách nhiệm quốc phòng của mọi thành phần kinh tế", "Nhằm mục đích miễn hoàn toàn các loại thuế khác cho doanh nghiệp", "Để giảm bớt số lượng cán bộ doanh nghiệp phải đi học"], "answer": 1, "placeholder": false}, {"id": 19, "set": 1, "number": 19, "level": "Thông hiểu", "text": "Hiện tượng điểm chạm trên bia bị LỆCH XUỐNG DƯỚI và SANG TRÁI trong khi ngắm bắn súng AK nguyên nhân chủ yếu do đâu?", "options": ["Đầu ngắm cao hơn mép trên ngón ngắm", "Nghiêng mặt súng sang trái và giữ đường ngắm thấp", "Đầu ngắm lệch sang phải", "Bóp cò quá nhanh làm giật nòng súng lên trên"], "answer": 1, "placeholder": false}, {"id": 20, "set": 1, "number": 20, "level": "Thông hiểu", "text": "Sự khác biệt căn bản giữa 'Vật che khuất' và 'Vật che đỡ' trong chiến thuật quân sự là gì?", "options": ["Vật che khuất chống được đạn, vật che đỡ chỉ che mắt địch", "Vật che khuất chỉ giấu được hành động, vật che đỡ vừa giấu được hành động vừa chống được đạn sát thương", "Cả hai loại vật thể đều có khả năng chống đạn như nhau", "Vật che đỡ chỉ sử dụng ban đêm, vật che khuất sử dụng ban ngày"], "answer": 1, "placeholder": false}, {"id": 21, "set": 1, "number": 21, "level": "Thông hiểu", "text": "Thủ đoạn 'Phi chính trị hóa lực lượng vũ trang' trong chiến lược 'Diễn biến hòa bình' của các thế lực thù địch nhằm mục đích gì?", "options": ["Tăng cường khả năng chiến đấu độc lập của quân đội", "Tách Quân đội và Công an ra khỏi sự lãnh đạo của Đảng Cộng sản Việt Nam", "Hiện đại hóa trang bị vũ khí cho lực lượng vũ trang", "Chuyển giao quyền chỉ huy quân đội cho chính quyền địa phương"], "answer": 1, "placeholder": false}, {"id": 22, "set": 1, "number": 22, "level": "Thông hiểu", "text": "Ý nghĩa chuyên môn của việc chọn Thước ngắm 3 khi bắn Bia số 4 cự li 100m tư thế nằm có bệ tỳ là gì?", "options": ["Đường đạn trùng khít với điểm ngắm tại mép dưới bia", "Đường đạn nhô cao nhất 28cm so với đường ngắm, trùng tâm vòng 10 khi ngắm mép dưới", "Giúp tăng tốc độ bay của đầu đạn lên gấp đôi", "Tránh hiện tượng súng bị nảy khi nhả đạn"], "answer": 1, "placeholder": false}, {"id": 23, "set": 1, "number": 23, "level": "Thông hiểu", "text": "Vùng Lãnh hải của Việt Nam được xác định có chiều rộng bao nhiêu hải lý kể từ đường cơ sở?", "options": ["6 hải lý", "12 hải lý", "24 hải lý", "200 hải lý"], "answer": 1, "placeholder": false}, {"id": 24, "set": 1, "number": 24, "level": "Thông hiểu", "text": "Tại sao Nghị quyết 71-NQ/TW của Bộ Chính trị coi đột phá phát triển GD&ĐT là quốc sách hàng đầu?", "options": ["Vì GD&ĐT quyết định trực tiếp đến sức mạnh tri thức, nguồn nhân lực chất lượng cao và vị thế quốc gia", "Nhằm mục đích tăng thu ngân sách nhà nước từ học phí", "Để giảm bớt số lượng lao động xuất khẩu ra nước ngoài", "Chỉ nhằm nâng cao tỷ lệ người biết chữ ở vùng sâu vùng xa"], "answer": 0, "placeholder": false}, {"id": 25, "set": 1, "number": 25, "level": "Thông hiểu", "text": "Điểm khác biệt cốt lõi giữa Bồi dưỡng kiến thức QPAN cho Đối tượng 1 và Đối tượng 2 theo VBHN 53/VBHN-BQP là gì?", "options": ["Đối tượng 1 học tại Trường Quân sự Quân khu, Đối tượng 2 học tại Học viện Quốc phòng", "Đối tượng 1 do Chủ tịch Hội đồng GDQPAN Trung ương triệu tập học tại Học viện Quốc phòng; Đối tượng 2 do Chủ tịch Hội đồng Quân khu triệu tập", "Đối tượng 1 chỉ dành cho khối doanh nghiệp, Đối tượng 2 dành cho khối nhà trường", "Cả hai đối tượng đều do Bộ trưởng Bộ GD&ĐT trực tiếp triệu tập"], "answer": 1, "placeholder": false}, {"id": 26, "set": 1, "number": 26, "level": "Thông hiểu", "text": "Trong Khung năng lực số (Thông tư 02/2025), Miền năng lực thứ 6 'Ứng dụng AI có trách nhiệm' đòi hỏi người học điều gì?", "options": ["Biết tự viết các mô hình trí tuệ nhân tạo phức tạp", "Hiểu bản chất, sử dụng AI sáng tạo, minh bạch, bảo mật dữ liệu và không vi phạm đạo đức số", "Thay thế hoàn toàn con người trong việc ra quyết định học tập", "Chỉ sử dụng AI để tìm kiếm tài liệu trên mạng"], "answer": 1, "placeholder": false}, {"id": 27, "set": 1, "number": 27, "level": "Thông hiểu", "text": "Tác dụng chuyên môn của dải garô cao su khi sơ cứu vết thương đứt động mạch lớn ở cẳng tay là gì?", "options": ["Thay thế băng gạc để giữ vệ sinh vết thương", "Tạo áp lực tĩnh ép chặt động mạch vào xương để ngưng chảy máu khẩn cấp", "Giúp vết thương nhanh liền sẹo mà không cần phẫu thuật", "Cố định xương cẳng tay bị gãy"], "answer": 1, "placeholder": false}, {"id": 28, "set": 1, "number": 28, "level": "Thông hiểu", "text": "Tỷ lệ tính điểm của phần thi Giảng dạy bài giảng điện tử trong Điều lệ Hội thi GVG môn GDQPAN 2026 được quy định như thế nào?", "options": ["Hệ số 1", "Hệ số 2", "Hệ số 3 (chiếm trọng số cao nhất)", "Hệ số 4"], "answer": 2, "placeholder": false}, {"id": 29, "set": 1, "number": 29, "level": "Vận dụng sâu", "text": "Một giáo viên thực hành bắn súng AK phát hiện học sinh bị chụm đạn về góc DƯỚI BÊN PHẢI của bia số 4. Giáo viên cần hướng dẫn học sinh điều chỉnh yếu lĩnh gì?", "options": ["Ngắm cao hơn và sang trái", "Kiểm tra mặt súng có bị nghiêng sang phải và mắt ngắm ngón quá thấp không, điều chỉnh mặt súng thăng bằng và ngắm đúng mép dưới", "Yêu cầu học sinh nín thở lâu hơn 30 giây", "Đổi sang thước ngắm 1 ngay lập tức"], "answer": 1, "placeholder": false}, {"id": 30, "set": 1, "number": 30, "level": "Vận dụng sâu", "text": "Khi đang giảng dạy bài học không gian mạng (Khối 10), học sinh hỏi về cách xử lý khi lộ mật khẩu tài khoản học tập trực tuyến. Xử lý sư phạm nào đúng nhất?", "options": ["Tắt máy tính và không sử dụng internet nữa", "Hướng dẫn đổi mật khẩu ngay, kích hoạt xác thực 2 lớp (2FA) và kiểm tra nhật ký đăng nhập", "Chờ ban quản trị hệ thống tự khắc phục", "Xóa tài khoản và tạo tài khoản mới"], "answer": 1, "placeholder": false}, {"id": 31, "set": 1, "number": 31, "level": "Vận dụng sâu", "text": "Trong buổi diễn tập chiến thuật, đội hình học sinh gặp chướng ngại vật có khói độc nhẹ và tiếng nổ nhỏ. Tư thế vận động phù hợp nhất là gì?", "options": ["Vọt tiến nhanh thân người cao", "Trườn mạp sát đất, sử dụng khăn ẩm che mũi miệng và quan sát hướng gió", "Đứng yên tại chỗ chờ lệnh rút lui", "Bò cao không cần che chắn mặt"], "answer": 1, "placeholder": false}, {"id": 32, "set": 1, "number": 32, "level": "Vận dụng sâu", "text": "Đêm tối quan sát bầu trời không mây, để xác định chính xác hướng Bắc địa lý nhằm di chuyển lực lượng, học sinh cần tìm chòm sao nào?", "options": ["Chòm sao Thiên Nga", "Chòm sao Đại Hùng (Bánh lái tàu) để tìm sao Bắc Đẩu", "Chòm sao Bọ Cạp", "Mặt trăng hướng Đông"], "answer": 1, "placeholder": false}, {"id": 33, "set": 1, "number": 33, "level": "Vận dụng sâu", "text": "Thí sinh tham dự thi GVG môn GDQPAN bốc thăm vào bài thực hành 'Kỹ thuật sử dụng lựu đạn' (Khối 11). Việc chuẩn bị thao trường an toàn tối thiểu cần đảm bảo điều gì?", "options": ["Dùng lựu đạn thật để tăng tính thực tế", "Sử dụng lựu đạn tập phi kim loại, kiểm tra hầm nấp, cờ hiệu an toàn và khoảng cách người quan sát >50m", "Không cần căng dây ranh giới thao trường", "Chỉ tập trong phòng học lý thuyết"], "answer": 1, "placeholder": false}, {"id": 34, "set": 1, "number": 34, "level": "Vận dụng sâu", "text": "Một nhà trường ngoài công lập muốn tối ưu hóa thuế TNDN khi chi 200 triệu đồng bồi dưỡng QPAN cho nhân viên. Kế toán cần căn cứ văn bản nào?", "options": ["Thông tư 46/2020/TT-BGDĐT", "Điều 12 Văn bản hợp nhất 53/VBHN-BQP 2025", "Luật Giáo dục 2019", "Nghị định về đăng ký doanh nghiệp"], "answer": 1, "placeholder": false}, {"id": 35, "set": 1, "number": 35, "level": "Vận dụng sâu", "text": "Khi giảng bài 'Diễn biến hòa bình' (Khối 12), giáo viên muốn tổ chức hoạt động học tập tích cực cho học sinh chuyên. Phương pháp hiệu quả nhất là gì?", "options": ["Đọc chép lại toàn bộ văn bản SGK", "Cho học sinh tranh luận sư phạm (Debate) phản bác tin giả/Deepfake và thiết kế Infographic truyền thông", "Chỉ chiếu phim tài liệu không thảo luận", "Yêu cầu học sinh học thuộc lòng các định nghĩa"], "answer": 1, "placeholder": false}, {"id": 36, "set": 1, "number": 36, "level": "Vận dụng sâu", "text": "Học sinh bị đứt động mạch đùi do tai nạn thao trường, máu phun thành tia đỏ tươi. Thứ tự xử lý sơ cứu sinh tử là gì?", "options": ["Rửa vết thương bằng nước sạch -> Đưa đi bệnh viện", "Ấn động mạch bẹn -> Đặt garô phía trên vết thương -> Băng ép -> Ghi phiếu garô -> Chuyển gấp đi cấp cứu", "Chỉ dùng băng gạc thông thường quấn chặt", "Cho uống thuốc giảm đau ngay lập tức"], "answer": 1, "placeholder": false}, {"id": 37, "set": 1, "number": 37, "level": "Vận dụng cao", "text": "Đánh giá giải pháp tổng thể để ngăn chặn hiệu quả thủ đoạn lợi dụng không gian mạng xâm phạm an ninh quốc gia trong nhà trường?", "options": ["Cấm toàn bộ học sinh mang thiết bị điện tử đến trường", "Xây dựng hạ tầng an toàn số, nâng cao Khung năng lực số 6 miền cho học sinh và phối hợp gia đình - nhà trường - cơ quan an ninh mạng", "Chỉ cài đặt phần mềm diệt virus trên máy tính phòng học", "Ủy quyền toàn bộ cho nhà mạng viễn thông xử lý"], "answer": 1, "placeholder": false}, {"id": 38, "set": 1, "number": 38, "level": "Vận dụng cao", "text": "Thế tay chiến lược kết hợp giữa Luật Giáo dục sửa đổi 2025 và Luật Nhà giáo 2025 tác động như thế nào đến chất lượng đội ngũ GDQPAN?", "options": ["Chỉ mang tính chất hình thức không có thay đổi thực chất", "Tạo bước đột phá thể chế: Tinh gọn bộ máy quản lý (bỏ Hội đồng trường công lập), bảo vệ vị thế nhà giáo và nâng lương cao nhất để thu hút nhân tài GDQPAN", "Làm tăng khối lượng công việc hành chính cho giáo viên", "Chuyển toàn bộ giáo viên GDQPAN sang lực lượng dân quân tự vệ"], "answer": 1, "placeholder": false}, {"id": 39, "set": 1, "number": 39, "level": "Vận dụng cao", "text": "Phân tích ý nghĩa chiến lược của việc thống nhất quản lý nhà nước về GDQPAN do Bộ Quốc p function start(mode){let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+40*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?'THI THỬ · BỘ ĐỀ 01':'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note"><b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn: bảng đáp án Master · đề ${q.set}, câu ${q.number}. Tài liệu không cung cấp giải thích.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:a.mode==='exam'?'Thi thử':'Luyện tập',date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
